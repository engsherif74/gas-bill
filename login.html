<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>تسجيل الدخول · محصّل الغاز</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/collector.css">
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 1rem;
    background: var(--bg);
  }
  .login-card {
    max-width: 420px;
    width: 100%;
  }
  .login-card h1 {
    text-align: center;
    font-size: 1.4rem;
    margin-bottom: .3rem;
    color: var(--tx);
  }
  .login-card .sub {
    text-align: center;
    color: var(--mu);
    margin-bottom: 1.2rem;
  }
  .login-card .logo {
    display: block;
    margin: 0 auto 1rem;
    width: 64px;
    height: 64px;
  }
  .login-btn {
    width: 100%;
    padding: 1rem;
    font-size: 1.1rem;
    font-weight: 800;
    background: #0f766e;
    color: #fff;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: background .2s;
    min-height: 50px;
  }
  .login-btn:hover { background: #14b8a6; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .msg-error { color: #dc2626; font-weight: 700; text-align: center; margin-top: .8rem; font-size: .9rem; min-height: 20px; }
  .msg-warn { color: #f59e0b; font-weight: 700; text-align: center; margin-top: .8rem; font-size: .85rem; min-height: 20px; }
  .msg-info { color: #0f766e; font-weight: 700; text-align: center; margin-top: .8rem; font-size: .9rem; min-height: 20px; }
  .field input { color: var(--ink) !important; }
</style>
</head>
<body>

<main class="login-card">
  <section class="card">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 3c3 9 14 13 14 26a14 14 0 0 1-28 0c0-6 3-9 6-12 0 5 3 7 5 7-2-8 0-15 3-21z" fill="#f2a516"/>
      <path d="M24 24c2 4 7 6 7 12a7 7 0 0 1-14 0c0-4 4-6 7-12z" fill="#1e6fa8"/>
    </svg>
    <h1>محصّل الغاز</h1>
    <p class="sub">اكتب بياناتك للدخول وتحميل الملفات.</p>
    <div class="stack">
      <label class="field"><span>رقم الأداء</span><input id="no" inputmode="numeric" autocomplete="off" placeholder="رقم الأداء"></label>
      <label class="field"><span>كلمة السر</span><input id="pw" type="password" autocomplete="off" placeholder="كلمة السر"></label>
    </div>
    <div class="actions" style="margin-top:1rem">
      <button class="login-btn" id="go" type="button">دخول</button>
    </div>
    <p class="msg-error" id="msg"></p>
    <p class="msg-warn" id="warn"></p>
    <p class="msg-info" id="info"></p>
  </section>
</main>
<script type="module">
import {login} from './js/collector/unlock.js';
import {loadFiles} from './js/collector/fileLoader.js';
import {isOn,enable,supported} from './js/collector/lock.js';

const $ = id => document.getElementById(id);
$('no').value = localStorage.getItem('lastNo') || '';

async function tryEnableLock(){
  try{
    if(await isOn()) return;
    if(!(await supported())) return;
    if(confirm('هل تريد تفعيل فتح التطبيق ببصمة أو نقش أو كلمة مرور الجهاز؟')){
      await enable();
      alert('تم تفعيل القفل.');
    }
  }catch(e){ console.warn(e); }
}

$('go').onclick = async () => {
  const b = $('go'), m = $('msg'), w = $('warn'), info = $('info');
  m.textContent = ''; w.textContent = ''; info.textContent = '';
  b.disabled = true;
  m.textContent = 'جارٍ التحقق…';
  
  const noValue = $('no').value.trim();
  const pwValue = $('pw').value.trim();
  
  if (!noValue) {
    m.textContent = '✕ اكتب رقم الأداء';
    b.disabled = false;
    return;
  }
  if (!pwValue) {
    m.textContent = '✕ اكتب كلمة السر';
    b.disabled = false;
    return;
  }
  
  info.textContent = `جارٍ الاتصال بـ keys.bin…`;
  
  try {
    const a = await login(noValue, pwValue);
    info.textContent = `تم التحقق من الرقم ${a.no}`;
    localStorage.setItem('lastNo', a.no);
    
    if (!a.name || a.name === 'محصّل') {
      w.textContent = 'تنبيه: لم يتم العثور على اسمك في السجلات. يرجى التواصل مع الأدمن.';
    }
    
    info.textContent = `جارٍ تحميل الملفات…`;
    const n = await loadFiles(a, t => info.textContent = t);
    info.textContent = `تم تحميل ${n} عميل. جارٍ الدخول…`;
    
    await tryEnableLock();
    location.replace('index.html');
  } catch(e) {
    m.textContent = '✕ ' + e.message;
    console.error('Login error:', e);
  }
  b.disabled = false;
};
</script>
</body>
</html>
