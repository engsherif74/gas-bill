<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2233">
<title>محصّل الغاز</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/collector.css">
</head>
<body>
<header class="top"><div>
  <button id="menuBtn" class="ico" aria-label="الواجهات الإضافية" hidden>⋮</button>
  <button id="back" class="ico" hidden aria-label="رجوع">→</button>
  <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3c3 9 14 13 14 26a14 14 0 0 1-28 0c0-6 3-9 6-12 0 5 3 7 5 7-2-8 0-15 3-21z" fill="#f2a516"/><path d="M24 24c2 4 7 6 7 12a7 7 0 0 1-14 0c0-4 4-6 7-12z" fill="#0a6fb0"/></svg>
  <span><h1>محصّل الغاز</h1><p id="who">جارٍ التحقق…</p></span><span class="pill" id="net">…</span>
</div></header>
<div id="menu" class="menu" hidden></div>
<main id="locked" hidden><section class="card empty"><h2>🔒 مقفل</h2><p class="mute">افتح ببصمتك.</p><div class="actions" style="justify-content:center"><button class="btn" id="unlockBtn">فتح</button><button class="btn ghost" id="relogin">ادخل بكلمة السر</button></div><p class="mute" id="lmsg"></p></section></main>
<main id="diag" hidden><section class="card"><h2>⚠️ تشخيص</h2><p class="mute">لم يكتمل التحميل.</p><pre id="diagText" style="white-space:pre-wrap;font-size:.8rem;background:#0001;padding:.6rem;border-radius:8px;overflow:auto;max-height:200px"></pre><div class="actions"><button class="btn" id="retry">إعادة المحاولة</button><button class="btn ghost" id="hardReset">مسح كل البيانات</button></div></section></main>
<main id="app" hidden><section id="view"></section></main>
<div id="upd" class="upd" hidden><span>ملف جديد</span><button class="btn sm" id="updBtn">حمّله</button></div>
<nav class="tabs" id="tabs" hidden><button data-t="home" class="on">التحصيل</button><button data-t="ledger">ما تم تحصيله</button><button data-t="search">بحث</button><button data-t="archive">الأرشيف</button><button data-t="details">التفاصيل</button></nav>
<div id="toast" role="status"></div>
<script>
(function(){
  var diagEl = document.getElementById('diag');
  var diagText = document.getElementById('diagText');
  function showDiag(msg){
    document.getElementById('who').textContent = 'تعذر التحميل';
    ['locked','app','tabs'].forEach(function(i){document.getElementById(i).hidden=true;});
    diagEl.hidden = false;
    diagText.textContent = String(msg);
  }
  window.addEventListener('error', function(e){ showDiag('JS error: ' + e.message + '\n' + (e.filename||'') + ':' + (e.lineno||'')); });
  window.addEventListener('unhandledrejection', function(e){ showDiag('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
  setTimeout(function(){
    if (!document.getElementById('app').hidden) return;
    if (!document.getElementById('locked').hidden) return;
    if (!diagEl.hidden) return;
    showDiag('لم يبدأ التطبيق بعد 3 ثوانٍ.\nتأكد من رفع js/collector/app.js.');
  }, 3000);
  document.getElementById('retry').onclick = function(){ location.reload(); };
  document.getElementById('hardReset').onclick = function(){
    if (!confirm('سيُمسح كل شيء. هل أنت متأكد؟')) return;
    (async function(){
      try{ var dbs = await indexedDB.databases(); for(var i=0;i<dbs.length;i++){ if(dbs[i].name) indexedDB.deleteDatabase(dbs[i].name); } }catch(e){}
      try{ localStorage.clear(); }catch(e){}
      try{ var ks = await caches.keys(); await Promise.all(ks.map(function(k){return caches.delete(k);})); }catch(e){}
      try{ var rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function(r){return r.unregister();})); }catch(e){}
      location.reload();
    })();
  };
  var s = document.createElement('script');
  s.type = 'module';
  s.src = 'js/collector/app.js';
  s.onerror = function(){ showDiag('فشل تحميل js/collector/app.js'); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
