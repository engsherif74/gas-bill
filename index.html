<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2233">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>محصّل الغاز</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/collector.css">
</head>
<body>
<header class="top"><div>
  <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3c3 9 14 13 14 26a14 14 0 0 1-28 0c0-6 3-9 6-12 0 5 3 7 5 7-2-8 0-15 3-21z" fill="#f2a516"/><path d="M24 24c2 4 7 6 7 12a7 7 0 0 1-14 0c0-4 4-6 7-12z" fill="#0a6fb0"/></svg>
  <span><h1>محصّل الغاز</h1><p>المرحلة 1: الأساس</p></span>
  <span class="pill" id="net">…</span>
</div></header>
<main>
  <section class="card">
    <h2>فحص الأساس</h2>
    <p class="mute">يتأكد أن التشفير والضغط وقاعدة بيانات الجهاز تعمل قبل البدء. أدخل أي رقم أداء وكلمة سر للتجربة، فلا يُحفظ شيء.</p>
    <div class="row">
      <label class="field"><span>رقم الأداء</span><input id="no" inputmode="numeric" autocomplete="off" value="1042"></label>
      <label class="field"><span>كلمة السر</span><input id="pw" type="password" autocomplete="off" value="تجربة-قوية-2026"></label>
    </div>
    <div class="actions"><button class="btn" id="run">شغّل الفحص</button><button class="btn ghost" id="install" hidden>ثبّت التطبيق</button></div>
    <ul class="tests" id="results"></ul>
  </section>
</main>
<script type="module" src="js/collector/app.js"></script>
</body>
</html>
